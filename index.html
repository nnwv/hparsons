<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Henry Parsons | Oakland, CA</title>

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Background layers */
    .bg {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: opacity 5s ease-in-out;
      z-index: -2;
    }

    .bg.top {
      z-index: -1;
    }

    .center-text {
      font-weight: bold;
      font-size: clamp(40px, 9vw, 90px);
      line-height: 1.05;
      letter-spacing: -2px;
      text-align: left;
      padding: 6vw;
      max-width: 30ch;
    }

    a {
      text-decoration: none;
      color: white;
    }

    a:hover {
      background-color: #679966;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <!-- Background layers -->
  <div class="bg" id="bg1"></div>
  <div class="bg top" id="bg2"></div>

  <div class="center-text">
    <a href="mailto:henry@henryparsons.com?subject=Hello%20Henry&">
      Henry Parsons
    </a>
    is an interior designer, artist and collector. He lives in Oakland,
    California.
  </div>

  <script>
    const images = [
      "images/01.jpg",
      "images/02.jpg",
      "images/03.jpg"
    ];

    let current = 0;

    const bg1 = document.getElementById("bg1");
    const bg2 = document.getElementById("bg2");

    // Initial images
    bg1.style.backgroundImage = `url(${images[0]})`;
    bg2.style.backgroundImage = `url(${images[1]})`;
    bg2.style.opacity = 0;

    let showingTop = false;

    setInterval(() => {
      current = (current + 1) % images.length;

      const nextImage = images[current];

      if (showingTop) {
        bg1.style.backgroundImage = `url(${nextImage})`;
        bg1.style.opacity = 1;
        bg2.style.opacity = 0;
      } else {
        bg2.style.backgroundImage = `url(${nextImage})`;
        bg2.style.opacity = 1;
        bg1.style.opacity = 0;
      }

      showingTop = !showingTop;
    }, 5000);
  </script>
</body>
</html>
